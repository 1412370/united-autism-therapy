# Builds the Astro site on every push to `main` and publishes the finished
# static files (dist/) to the `deploy` branch. cPanel's Git Version Control
# clones the `deploy` branch and copies it into public_html via .cpanel.yml.
name: Build and publish deploy branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run audit

      - name: Publish dist/ to the deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy
          publish_dir: ./dist
          force_orphan: false
          commit_message: 'Deploy ${{ github.sha }}'

      # Uploads the built site to GoDaddy hosting (unitedautismtherapy.org).
      # Runs only when the FTP secrets are set in GitHub:
      #   FTP_SERVER, FTP_USERNAME (deploy@unitedautismtherapy.org), FTP_PASSWORD.
      # server-dir is relative to the FTP account's root, which is public_html.
      - name: Deploy to GoDaddy (public_html)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ./
